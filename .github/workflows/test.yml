

name: MLOps CI and Docker

on: [push, pull_request]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Get Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pytest
        run: pip install pytest

      - name: Run Tests
        run: pytest test_ci.py -v

      - name: Build Docker Image
        run: docker build -t student-performance-ml .
